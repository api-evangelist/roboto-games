aid: roboto-games
name: Roboto Games
description: >-
  Roboto Games is an independent video game development studio building
  Stormforge, an open-world survival crafting game where players craft, build,
  fight, and harness epic storms to survive in a magical fantasy world. The
  studio was surfaced as a portfolio company of a16z and added to the API
  Evangelist network for enrichment. As a consumer game studio, Roboto Games
  publishes a marketing website, a careers page, and a studio blog, but exposes
  no public developer API, SDK, or programmatic surface — its player-facing
  experience is delivered through native game clients (Steam) and community
  channels (Discord, YouTube, Twitch) rather than an HTTP API. This profile
  captures the studio's public identity and web properties; no API artifacts are
  produced because none are published.
